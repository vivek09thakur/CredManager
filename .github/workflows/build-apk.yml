name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    uses: vivek09thakur/APK_Export_Workflow/.github/workflows/build-apk.yml@v1
    with:
      app-directory: credmanager
